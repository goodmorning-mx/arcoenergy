server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}
