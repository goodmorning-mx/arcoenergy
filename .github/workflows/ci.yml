name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: alembic history --verbose

  next:
    name: Next.js checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  crm:
    name: CRM checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose --profile hybrid config
      - run: docker compose --profile hybrid build
      - run: docker build --tag goodmorning-mvp-template-gateway:ci ./gateway
      - run: docker build --tag goodmorning-mvp-template-seo:ci ./seo
      - run: docker compose --profile hybrid up --build --wait
      - run: curl --fail http://127.0.0.1:18081/api/health
      - run: curl --fail http://127.0.0.1:18081/api/version | grep -F '"commit_sha":"unknown"'
      - run: curl --fail http://127.0.0.1:18081/ | grep -F 'ArcoEnergy'
      - run: curl --fail http://127.0.0.1:18081/app/ | grep -F 'ArcoEnergy Campo'
      - run: curl --fail http://127.0.0.1:18081/crm/ | grep -F 'ArcoEnergy'
      - name: Verify PWA and CRM render in Chrome
        shell: bash
        run: |
          set -euo pipefail
          smoke_render() {
            local route="$1" marker="$2" output log profile
            output="$(mktemp)"
            log="$(mktemp)"
            profile="$(mktemp -d)"
            google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-extensions \
              --user-data-dir="$profile" --virtual-time-budget=7000 --dump-dom \
              "http://127.0.0.1:18081${route}/" >"$output" 2>"$log"
            if grep -Eq 'Uncaught|SEVERE' "$log"; then
              cat "$log"
              return 1
            fi
            if ! grep -Fq "$marker" "$output"; then
              echo "Chrome did not find the expected UI marker '$marker' on ${route}. Rendered UI text follows."
              sed -E 's/<[^>]+>/ /g' "$output" | tr -s '[:space:]' ' ' | cut -c1-1200
              cat "$log"
              return 1
            fi
          }
          smoke_render /app/login 'Iniciar sesión'
          smoke_render /crm/login 'Iniciar sesión'
          smoke_render /login 'Iniciar sesión'
      - name: Verify routed PWA and CRM bundles
        shell: bash
        run: |
          set -euo pipefail
          verify_surface() {
            local route="$1" html js css js_type css_type
            html="$(curl --fail --silent --show-error "http://127.0.0.1:18081${route}/")"
            js="$(printf '%s' "$html" | sed -nE 's/.*src="([^"]+\.js)".*/\1/p' | head -n1)"
            css="$(printf '%s' "$html" | sed -nE 's/.*href="([^"]+\.css)".*/\1/p' | head -n1)"
            [[ "$js" == "${route}"/assets/*.js ]]
            [[ "$css" == "${route}"/assets/*.css ]]
            js_type="$(curl --fail --silent --show-error --output "/tmp/arcoenergy-${route#/}-bundle.js" --write-out '%{content_type}' "http://127.0.0.1:18081${js}")"
            css_type="$(curl --fail --silent --show-error --output "/tmp/arcoenergy-${route#/}-bundle.css" --write-out '%{content_type}' "http://127.0.0.1:18081${css}")"
            [[ "$js_type" == application/javascript ]]
            [[ "$css_type" == text/css ]]
            [[ "$(wc -c < "/tmp/arcoenergy-${route#/}-bundle.js")" -gt 10000 ]]
            [[ "$(wc -c < "/tmp/arcoenergy-${route#/}-bundle.css")" -gt 1000 ]]
          }
          verify_surface /app
          verify_surface /crm
          manifest_type="$(curl --fail --silent --show-error --output /tmp/arcoenergy-manifest.json --write-out '%{content_type}' http://127.0.0.1:18081/app/manifest.webmanifest)"
          [[ "$manifest_type" == application/manifest+json ]]
          python -c 'import json; m=json.load(open("/tmp/arcoenergy-manifest.json")); assert m["start_url"] == "/app/" and m["scope"] == "/app/"'
      - run: curl --fail http://127.0.0.1:18081/app/version.json | grep -F '"commit_sha":"unknown"'
      - run: curl --fail http://127.0.0.1:18081/crm/version.json | grep -F '"commit_sha":"unknown"'
      - if: always()
        run: docker compose --profile hybrid down --volumes
